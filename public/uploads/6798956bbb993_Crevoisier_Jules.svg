<svg width="500" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond ciel et sol -->
  <rect width="500" height="250" fill="skyblue" />
  <rect y="250" width="500" height="250" fill="green" />
  
  <!-- Soleil -->
  <circle cx="400" cy="100" r="50" fill="yellow" />
  
  <!-- Groupe de nuages -->
  <g id="clouds" fill="white">
    <ellipse cx="80" cy="60" rx="30" ry="20" />
    <ellipse cx="110" cy="60" rx="30" ry="20" />
    <ellipse cx="95" cy="40" rx="30" ry="20" />
  </g>

  <!-- Maison -->
  <rect x="300" y="300" width="80" height="80" fill="white" stroke="black" />
  <polygon points="300,300 340,250 380,300" fill="brown" stroke="black" />
  <rect x="330" y="330" width="20" height="30" fill="black" />

  <!-- Voiture -->
  <g id="car">
    <rect x="50" y="420" width="60" height="30" fill="red" />
    <circle cx="60" cy="460" r="10" fill="black" />
    <circle cx="90" cy="460" r="10" fill="black" />
  </g>

  <!-- Animations -->
  <animateTransform 
    href="#clouds" 
    attributeName="transform" 
    type="translate" 
    from="-500,0" 
    to="500,0" 
    dur="10s" 
    repeatCount="indefinite" />
  
  <animateTransform 
    href="#car" 
    attributeName="transform" 
    type="translate" 
    from="0,0" 
    to="400,0" 
    dur="5s" 
    repeatCount="indefinite" />
</svg>
